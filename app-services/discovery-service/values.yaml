replicaCount: 1

kind: StatefulSet

image:
  repository: harbor.local.fintech23.xyz/splitbill/discovery-service
  pullPolicy: Always
  tag: "qa"

imagePullSecrets:
  - harbor-local-fintech23-xyz-image-pull-secrets

config:
  HOSTNAME: "discovery-service"
  EUREKA_DEFAULT_ZONE: "http://bs23-ib-rt-discovery-service-statefulset-0.bs23-ib-rt-discovery-service-hl-service:8761/eureka/,http://bs23-ib-rt-discovery-service-statefulset-1.bs23-ib-rt-discovery-service-hl-service:8761/eureka/,http://bs23-ib-rt-discovery-service-statefulset-2.bs23-ib-rt-discovery-service-hl-service:8761/eureka/"
  SERVER_PORT: "8761"
  SPRING_PROFILES_ACTIVE: "k8s"
  DEV_HOME: "/tmp/logs"
  LOG_MAX_FILESIZE: "100MB"
  LOG_MAX_FILECOUNT: "6"
  TZ: "Asia/Dhaka"
  OTEL_JAVAAGENT_ENABLED: "true"
  OTEL_SERVICE_NAME: "bs23-ib-rt-discovery-service"
  OTEL_TRACES_SAMPLER: "always_on"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcollector-collector:4317"

service:
  - name: hl
    type: Headless
    targetPort: 8761
    port: 8761

liveness:
  enabled: true
  method: http
  service: hl
  path: "/actuator/health/liveness"
  initialDelaySeconds: 30
  periodSeconds: 10

readiness:
  enabled: true
  method: http
  service: hl
  path: "/actuator/health
